services:
  mlflow:
    build:
      context: .
      dockerfile: Dockerfile.mlflow
    image: fraud-mlflow
    # Migre le schéma d'une base existante (ex. créée en 2.x) avant de démarrer
    command:
      - sh
      - -c
      - >
        if [ -f /mlflow/mlflow.db ]; then mlflow db upgrade sqlite:///mlflow/mlflow.db; fi &&
        exec mlflow server
        --backend-store-uri sqlite:///mlflow/mlflow.db
        --artifacts-destination /mlflow/mlartifacts
        --serve-artifacts
        --host 0.0.0.0
        --port 5000
        --workers 1
    environment:
      MALLOC_ARENA_MAX: "2"
      # Hosts acceptés par MLflow 3.x (protection DNS rebinding) : nom du service
      # pour les autres conteneurs + localhost. Sur l'EC2, ajouter l'IP / le DNS
      # public dans .env pour accéder à l'UI depuis un navigateur.
      MLFLOW_SERVER_ALLOWED_HOSTS: ${MLFLOW_SERVER_ALLOWED_HOSTS:-mlflow,mlflow:*,localhost,localhost:*,127.0.0.1,127.0.0.1:*}
    ports:
      - "5000:5000"
    volumes:
      - mlflow-data:/mlflow
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 30s

  trainer:
    build:
      context: .
      dockerfile: Dockerfile
    image: fraud-app
    command: python main.py
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
    depends_on:
      mlflow:
        condition: service_healthy
    profiles: ["tools"]

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: fraud-app
    command: streamlit run app.py --server.address=0.0.0.0 --server.port=8501
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
    depends_on:
      mlflow:
        condition: service_healthy

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - app

volumes:
  mlflow-data: