; Authentification de l'UI / API MLflow sur Cloud Run (--app-name basic-auth).
; Base des utilisateurs sur le disque du conteneur : seul admin existe, recréé à chaque
; démarrage depuis MLFLOW_AUTH_ADMIN_PASSWORD (Secret Manager). Le bucket est trop lent
; pour les migrations SQLite du premier démarrage.
[mlflow]
default_permission = READ
database_uri = sqlite:////tmp/basic_auth.db
admin_username = admin
authorization_function = mlflow.server.auth:authenticate_request_basic_auth
grant_default_workspace_access = false
